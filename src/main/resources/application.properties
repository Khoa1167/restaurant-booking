# Database
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=root
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/restaurant_db

# Auto create tables
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# JWT
mp.jwt.verify.issuer=restaurant-app
smallrye.jwt.sign.key.location=classpath:privateKey.pem
mp.jwt.verify.publickey.location=classpath:publicKey.pem

# Swagger
quarkus.swagger-ui.always-include=true